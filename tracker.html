<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Tracker</title>
<style>
  :root {
    --navy: #2b3245;
    --bg: #eef0f3;
    --card-border: #e2e4e9;
    --text-dark: #1f2430;
    --blue-link: #1e3fae;
    --empty-text: #8a8f9c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header.topbar {
    background: var(--navy);
    display: flex;
    align-items: center;
    padding: 0 24px;
    height: 64px;
    gap: 24px;
  }

  .logo {
    background: #2e9e4f;
    color: #fff;
    font-weight: 700;
    font-style: italic;
    font-size: 20px;
    padding: 10px 18px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .search-wrap {
    flex: 1;
    max-width: 640px;
    display: flex;
    align-items: center;
    background: #3a4155;
    border-radius: 6px;
    padding: 8px 14px;
    color: #b8bcc8;
    gap: 10px;
  }

  .search-wrap svg { flex-shrink: 0; opacity: 0.8; }

  .search-wrap span.placeholder {
    flex: 1;
    font-size: 14px;
  }

  .kbd {
    background: #2b3245;
    border: 1px solid #4a5169;
    color: #cfd3dd;
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 4px;
  }

  nav.topnav {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  nav.topnav a {
    color: #cfd3dd;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 10px 16px;
    border-radius: 6px;
  }

  nav.topnav a.active {
    background: #3a4155;
    color: #fff;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #4c5468;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 16px;
    margin-left: 8px;
    flex-shrink: 0;
  }

  /* Main content */
  main {
    flex: 1;
    padding: 24px 32px 40px;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 20px;
    color: var(--text-dark);
  }

  .card {
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(20, 25, 40, 0.04);
    max-width: 900px;
  }

  .card-header {
    display: flex;
    align-items: center;
    padding: 16px 18px;
  }

  .card-header .title {
    color: var(--blue-link);
    font-weight: 600;
    font-size: 15px;
  }

  .tracker-table-wrap {
    overflow-x: auto;
  }

  .tracker-table {
    display: flex;
    flex-direction: column;
    min-width: 560px;
    border-top: 1px solid var(--card-border);
  }

  .tracker-row {
    display: flex;
  }

  .tracker-row:not(:last-child) {
    border-bottom: 1px solid var(--card-border);
  }

  .tracker-cell {
    flex: 1 1 25%;
    padding: 10px 18px;
    font-size: 14px;
    color: var(--text-dark);
  }

  .tracker-cell:not(:last-child) {
    border-right: 1px solid var(--card-border);
  }

  .tracker-head .tracker-cell {
    font-size: 13px;
    font-weight: 700;
    color: var(--empty-text);
  }

  .tracker-body:empty::after {
    content: '-- empty --';
    display: block;
    padding: 14px 18px;
    font-size: 14px;
    color: var(--empty-text);
  }

  /* Footer */
  footer {
    background: var(--navy);
    color: #b8bcc8;
    text-align: center;
    padding: 22px 0;
    font-size: 14px;
    line-height: 1.6;
  }

  footer .copyright { color: #d7dae0; }
  footer .version { font-size: 13px; color: #8f95a6; }

  /* Responsive */
  @media (max-width: 860px) {
    header.topbar {
      flex-wrap: wrap;
      height: auto;
      padding: 12px 16px;
      row-gap: 10px;
    }

    .search-wrap {
      order: 3;
      flex-basis: 100%;
      max-width: none;
    }

    nav.topnav {
      flex-wrap: wrap;
    }
  }

  @media (max-width: 640px) {
    main {
      padding: 16px 16px 32px;
    }

    .kbd {
      display: none;
    }
  }

  @media (max-width: 420px) {
    nav.topnav a {
      padding: 8px 10px;
      font-size: 14px;
    }

    .logo {
      font-size: 17px;
      padding: 8px 14px;
    }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">MEPHAM</div>

  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <span class="placeholder">Search</span>
    <span class="kbd">CTRL + K</span>
  </div>

  <nav class="topnav">
    <a href="shutterfly-board.html">Standings</a>
    <a href="#">Orders</a>
    <a href="#">Search</a>
    <a href="tracker.html" class="active">Time Tracker</a>
  </nav>

  <div class="avatar">T</div>
</header>

<main>
  <h1>Time Tracker</h1>

  <div class="card">
    <div class="card-header">
      <span class="title">Time Tracker</span>
    </div>
    <div class="tracker-table-wrap">
      <div class="tracker-table">
        <div class="tracker-row tracker-head">
          <div class="tracker-cell">Tracking ID</div>
          <div class="tracker-cell">Maya</div>
          <div class="tracker-cell">Zulu</div>
          <div class="tracker-cell">Builder</div>
        </div>
        <div class="tracker-body" id="trackerBody"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="copyright">© 2026 MagicLabs. All rights reserved.</div>
  <div class="version">mb-engine · v2.0.10</div>
</footer>

<script>
  var TRACKER_STORAGE_KEY = 'sfy-time-tracker-rows';
  var TRACKER_API_URL = '/.netlify/functions/tracker';
  var trackerBody = document.getElementById('trackerBody');

  function renderRows(rows) {
    trackerBody.innerHTML = '';

    rows.forEach(function (entry) {
      var row = document.createElement('div');
      row.className = 'tracker-row';

      [entry.trackingValue, entry.maya, entry.zulu, entry.builder].forEach(function (value) {
        var cell = document.createElement('div');
        cell.className = 'tracker-cell';
        cell.textContent = value || '–';
        row.appendChild(cell);
      });

      trackerBody.appendChild(row);
    });
  }

  function renderFromLocalStorage() {
    var raw = localStorage.getItem(TRACKER_STORAGE_KEY);
    renderRows(raw ? JSON.parse(raw) : []);
  }

  function refreshFromServer() {
    fetch(TRACKER_API_URL)
      .then(function (res) {
        if (!res.ok) throw new Error('Bad response: ' + res.status);
        return res.json();
      })
      .then(function (rows) {
        renderRows(rows);
        localStorage.setItem(TRACKER_STORAGE_KEY, JSON.stringify(rows));
      })
      .catch(function (err) {
        console.error('Failed to load tracker rows from Turso, using local cache:', err);
        renderFromLocalStorage();
      });
  }

  refreshFromServer();

  window.addEventListener('storage', function (e) {
    if (e.key === TRACKER_STORAGE_KEY) renderFromLocalStorage();
  });

  setInterval(refreshFromServer, 5000);
</script>

</body>
</html>
